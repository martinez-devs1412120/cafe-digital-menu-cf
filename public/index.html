<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sparks Café</title>
  <meta name="theme-color" content="#fafaf8">
  <style>html,body{margin:0;height:100%;background:#fafaf8;color:#73726d;font:14px/1.5 'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}a{color:#c2571b}</style>
  <meta http-equiv="refresh" content="0;url=/client/">
  <script>
    // Preserve any query string (e.g. ?t=<table-token>) that the meta-refresh would drop.
    var qs = window.location.search;
    if (qs) window.location.replace('/client/' + qs);
    else window.location.replace('/client/');
  </script>
</head>
<body>
  <p>Redirecting… <a href="/client/">click here</a> if nothing happens.</p>
</body>
</html>
